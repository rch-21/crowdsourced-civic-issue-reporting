services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: civic-issue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civic_issue
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
    ports:
      - "55432:5432"
    volumes:
      - civic_issue_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civic_issue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  civic_issue_pgdata:
