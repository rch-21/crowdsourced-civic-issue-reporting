services:
  - type: web
    name: civic-issue-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev --include=workspace-root && npm run build -w @civic/api
    startCommand: npm run start -w @civic/api
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: BODY_LIMIT
        value: 22000000
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:5175,https://web-apex-deploy.vercel.app,https://admin-apex-deploy.vercel.app
      - key: DATABASE_URL
        sync: false
